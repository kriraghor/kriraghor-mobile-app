name: Build APK

# "Run workflow" in the Actions tab builds a new Android APK on EAS with the project's Expo account
# (the EXPO_TOKEN secret). Needed when the app icon, the native splash, the app version or a native module
# changes: over-the-air updates (ci.yml) never change those. The APK link is in the run's summary.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile (eas.json)
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: build-apk-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS build (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build on EAS and wait for the APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_BUILD_NO_EXPO_GO_WARNING: 'true'
        run: |
          eas build --platform android --profile "${{ inputs.profile }}" --non-interactive --wait --json > build.json
          node -e '
            const [b] = require("./build.json");
            const lines = [
              `## Android APK (${b.buildProfile}, version ${b.appVersion}, build ${b.appBuildVersion})`,
              "",
              `- Download: ${b.artifacts?.buildUrl ?? b.artifacts?.applicationArchiveUrl ?? "(none)"}`,
              `- Build page: https://expo.dev/accounts/${b.project?.ownerAccount?.name ?? "_"}/projects/${b.project?.slug ?? "kriraghor"}/builds/${b.id}`,
              `- Commit: ${b.gitCommitHash ?? process.env.GITHUB_SHA}`,
            ];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
            console.log(lines.join("\n"));
          '
