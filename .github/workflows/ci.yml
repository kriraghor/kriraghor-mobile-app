name: CI & Deployment Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  infrastructure-checks:
    uses: kriraghor/kriraghor-infrastructure/.github/workflows/expo-app.yml@main
    secrets: inherit

  # Over-the-air update for installed apps, on every push to main after the checks pass.
  # Each APK listens on the channel of its build profile (eas.json): preview builds on "preview",
  # production builds on "production". Publishing to both by name reaches whichever is installed.
  # Only apps whose runtime (the app version in app.config.ts) matches get it; a version bump
  # needs a new build.
  eas-update:
    name: Publish OTA Update (${{ matrix.channel }})
    needs: [infrastructure-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [preview, production]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish EAS Update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          APP_ENV: ${{ matrix.channel }}
        run: eas update --channel ${{ matrix.channel }} --message "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)" --non-interactive
